plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.homemonitor'
    compileSdk 37

    defaultConfig {
        applicationId "com.example.homemonitor"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "0.1.3"
        buildConfigField "String", "BUILD_DATE", "\"${new java.text.SimpleDateFormat('yyyy-MM-dd HH:mm').format(new java.util.Date())}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX
    def camerax_version = "1.4.0-alpha04"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:1.4.0-alpha04"

    // ZXing Core (QR generieren & scannen)
    implementation 'com.google.zxing:core:3.5.3'

    // OkHttp (Tor-Requests über Orbot SOCKS-Proxy)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Kotlin coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Moshi for JSON serialization (replaces manual serializer)
    implementation "com.squareup.moshi:moshi:1.15.0"

    // Lifecycle ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0"

    // Security Crypto for EncryptedSharedPreferences
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
